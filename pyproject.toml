[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
py-modules = []

[project]
name = "roboparty-train"
version = "0.1.0"
description = "RP1/RPO training overlay on unmodified Isaac Lab 3.0."
requires-python = ">=3.12,<3.13"
dependencies = [
    "isaaclab-dev[ov,importers]",
    "robo-newton",
    "rsl-rl-lib",
]

# Keep indexes and overrides aligned with IsaacLab-3.0/pyproject.toml [tool.uv].
[[tool.uv.index]]
url = "https://pypi.nvidia.com"
explicit = false

[[tool.uv.index]]
name = "pypi-public"
url = "https://pypi.org/simple"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv]
package = false
index-strategy = "unsafe-best-match"
prerelease = "allow"
python-preference = "only-managed"
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
override-dependencies = [
    "numpy>=2",
    "mujoco~=3.12.0",
    "mujoco-warp~=3.12.0",
    "newton[sim]==1.6.1",
    "newton-usd-schemas>=0.5.0",
    "usd-exchange==3.0.1",
    "usd-optimize~=1.3.1",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "fsspec>=2026.6.0",
    "packaging>=20,<27",
    "urllib3>=2.8.0",
]

[tool.uv.sources]
isaaclab-dev = { path = "IsaacLab-3.0", editable = true }
robo-newton = { path = "robo_newton", editable = true }
rsl-rl-lib = { path = "rsl_rl", editable = true }
omniverseclient = { index = "pypi-public" }
ovphysx = { index = "pypi-public" }
ovrtx = { index = "pypi-public" }
ovstage = { index = "pypi-public" }
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
